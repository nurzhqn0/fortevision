[project]
name = "fortevision"
version = "0.1.0"
description = "AI service for detecting cash discipline violations in bank surveillance videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fortevision"]
